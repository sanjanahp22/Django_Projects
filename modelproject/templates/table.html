<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
    <table border='2px'>
        <caption><h1>Student Database</h1></caption>
        <tr>
            <th>name</th>
            <th>branch</th>
            <th>age</th>
            <th>place</th>
            <th>phonenum</th>
            <th>dob</th>
            <th>email</th>


        </tr>
        {% for i in stud %}
        <td>
            {{i.name}}
        </td>
        <td>
            {{i.branch}}
        </td>
        <td>
            {{i.age}}
        </td>

        <td>
            {{i.place}}
        </td>

        <td>
            {{i.phonenum}}
        </td>
        <td>
            {{i.dob}}
        </td>

        <td>
            {{i.email}}
        </td>
        </tr>
        {% endfor %}
    </table>
    
</body>
</html>
