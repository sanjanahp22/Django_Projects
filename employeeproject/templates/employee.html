
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        .one {
            width: 280px;
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .one img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
        }

        .one p {
            color: #555;
            font-size: 16px;
            margin: 12px 0;
        }

        .one strong {
            color: #222;
        }
    </style>
</head>

<body>

    <h1>Employee Details</h1>

    <div class="container">
        {% for i in emp %}
        <div class="one">

            {% if i.image %}
                <img src="{{ i.image.url }}" alt="Employee Image">
            {% endif %}

            <p><strong>Name:</strong> {{ i.Employeename }}</p>
            <p><strong>Age:</strong> {{ i.Employyeage }}</p>
            <p><strong>Role:</strong> {{ i.Employeerole }}</p>
            <p><strong>Salary:</strong> ₹{{ i.Employeesalary }}</p>
            <p><strong>Description:</strong> {{ i.description }}</p>

        </div>
        {% empty %}
            <p>No employee records found.</p>
        {% endfor %}
    </div>

</body>
</html>
